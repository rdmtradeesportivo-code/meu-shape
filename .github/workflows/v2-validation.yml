name: Validacao Meu Shape V2
on:
  push:
    branches: [feat/meu-shape-v2-homologacao]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar biblioteca, imagens e cache offline
        run: node test-v2.cjs
      - name: Preparar Chromium para teste mobile
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar interface mobile em Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/meu-shape-server.log 2>&1 &
          sleep 2
          node test-browser-v2.mjs
      - name: Preparar pacote de homologação separado
        run: |
          mkdir -p homologacao-meu-shape-v2
          cp index.html manifest.webmanifest icon.svg sw.js v2-extra.js exercise-library.js exercise-visuals.js homologacao-meu-shape-v2/
          printf '%s\n' 'Meu Shape V2 - homologação. Abra por um servidor HTTP local, não via file://. Esta versão NÃO substitui a instalação principal.' > homologacao-meu-shape-v2/LEIA-ME.txt
      - name: Disponibilizar pacote de homologação
        uses: actions/upload-artifact@v4
        with:
          name: meu-shape-v2-homologacao
          path: homologacao-meu-shape-v2/
          retention-days: 14
      - name: Salvar capturas para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meu-shape-v2-mobile
          path: '*-v2-mobile.png'
          if-no-files-found: ignore
