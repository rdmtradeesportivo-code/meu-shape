<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a19"><link rel="manifest" href="manifest.webmanifest"><title>Meu Shape</title><style>body{font-family:system-ui;background:#101a19;color:#eef7f2;margin:0;padding:18px;max-width:700px;margin:auto}h1{margin-bottom:0;color:#a2e8b9}small,.muted{color:#9eafa9}.tabs{display:flex;overflow:auto;gap:7px;margin:22px 0}.tabs button{white-space:nowrap}button,input,select,textarea{font:inherit;border-radius:10px;border:1px solid #455952;padding:11px;background:#20302b;color:white}button{cursor:pointer}.primary{background:#a2e8b9;color:#102018;font-weight:700}section{background:#182521;padding:15px;border-radius:16px;margin:12px 0}label{display:block;margin:10px 0 4px}input,select,textarea{box-sizing:border-box;width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{border-bottom:1px solid #35453d;padding:9px 0}.item:last-child{border:0}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}canvas{width:100%;height:180px} .danger{color:#ffb9b9}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#20332d;padding:14px;border-radius:12px}.metric strong{display:block;font-size:23px;color:#a2e8b9;margin:6px 0}.chart{width:100%;height:auto;max-height:220px}.hint{color:#a2b6ad;font-size:13px}.good{color:#a2e8b9}@media(min-width:550px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><h1>MEU SHAPE</h1><small>Seu diário de evolução • dados no aparelho</small><nav class="tabs" id="tabs"></nav><main id="main"></main><script>
const DAYS=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];const WORK=[['Agachamento livre ou hack','Leg press 45°','Cadeira extensora','Afundo reverso','Panturrilha em pé'],['Supino reto','Supino inclinado','Desenvolvimento','Elevação lateral','Tríceps na polia'],['Stiff','Elevação pélvica','Mesa flexora','Cadeira adutora','Cadeira abdutora','Panturrilha sentada'],['Puxada alta','Remada apoiada','Remada unilateral','Crucifixo inverso','Rosca direta','Rosca martelo'],['Agachamento smith ou hack','Leg press','Flexora sentada','Passada','Panturrilha no leg press','Abdominal'],['Supino máquina','Puxada neutra','Remada baixa','Elevação lateral','Rosca alternada','Tríceps francês','Prancha']];const TITLES=['Pernas A — Quadríceps','Push — Peito e ombros','Pernas B — Glúteos e posterior','Pull — Costas e bíceps','Pernas C — Completo','Superior complementar'];const KEY='meushape-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}db=db&&typeof db==='object'?db:{records:[],diet:[]};db.records=Array.isArray(db.records)?db.records:[];db.diet=Array.isArray(db.diet)?db.diet:[];let tab='Dashboard';const tabs=['Dashboard','Treino','Evolução','Alimentação','Aplicações','Exames','Backup'];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const today=()=>new Date().toLocaleDateString('en-CA');const input=(id,label,type='text',value='')=>`<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}">`;const val=id=>document.getElementById(id)?.value||'';const add=(type,fields)=>{db.records.push({id:Date.now()+Math.random(),type,date:val('date')||today(),...fields});save();render()};const entries=(type)=>db.records.filter(x=>x.type===type).sort((a,b)=>b.date.localeCompare(a.date));const list=(type,fn)=>entries(type).slice(0,40).map(x=>`<div class="item">${fn(x)} <button onclick="remove(${x.id})" aria-label="Excluir registro">Excluir</button></div>`).join('')||'<p class="muted">Nenhum registro ainda.</p>';window.remove=id=>{if(confirm('Excluir este registro?')){db.records=db.records.filter(x=>x.id!==id);save();render()}};const num=x=>{let n=Number(String(x??'').replace(',','.'));return Number.isFinite(n)?n:null};const fmt=(n,d=1)=>n===null||!Number.isFinite(n)?'—':n.toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:d});const chronological=t=>db.records.filter(x=>x.type===t&&/^\\d{4}-\\d{2}-\\d{2}$/.test(x.date)).sort((a,b)=>a.date.localeCompare(b.date));const metric=(name,value,detail='')=>'<div class="metric"><small>'+name+'</small><strong>'+value+'</strong><small>'+detail+'</small></div>';function graph(points,label,unit){const data=points.filter(p=>num(p.v)!==null).slice(-24);if(!data.length)return '<p class="muted">Registre suas medidas para visualizar o gráfico.</p>';const W=600,H=190,p=34,vs=data.map(x=>num(x.v)),lo=Math.min(...vs),hi=Math.max(...vs),range=Math.max(hi-lo,1),coords=data.map((x,i)=>({x:p+(W-2*p)*(data.length===1?.5:i/(data.length-1)),y:H-p-(num(x.v)-lo)/range*(H-2*p)})),line=coords.map(x=>x.x.toFixed(1)+','+x.y.toFixed(1)).join(' ');return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'"><line x1="'+p+'" y1="'+(H-p)+'" x2="'+(W-p)+'" y2="'+(H-p)+'" stroke="#5c7367"/><polyline points="'+line+'" fill="none" stroke="#a2e8b9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+coords.map(c=>'<circle cx="'+c.x+'" cy="'+c.y+'" r="4" fill="#a2e8b9"/>').join('')+'<text x="'+p+'" y="16" fill="#cde5d6" font-size="13">'+fmt(hi)+' '+esc(unit)+'</text><text x="'+p+'" y="'+(H-6)+'" fill="#cde5d6" font-size="13">'+fmt(lo)+' '+esc(unit)+'</text></svg><p class="hint">'+esc(data[0].date)+' até '+esc(data[data.length-1].date)+' · '+data.length+' registros exibidos</p>'}function dashboard(){const body=chronological('corpo'),weights=body.filter(x=>num(x.weight)!==null&&num(x.weight)>0),waists=body.filter(x=>num(x.waist)!==null&&num(x.waist)>0),training=chronological('treino'),food=chronological('alimento'),last=weights.at(-1),first=weights[0],lastWaist=waists.at(-1),firstWaist=waists[0],delta=first&&last?num(last.weight)-num(first.weight):null,wd=firstWaist&&lastWaist?num(lastWaist.waist)-num(firstWaist.waist):null;const now=new Date(),month=now.toLocaleDateString('en-CA').slice(0,7),thisMonth=training.filter(x=>x.date.startsWith(month)),days=new Set(thisMonth.map(x=>x.date)).size,monthFoods=food.filter(x=>x.date.startsWith(month)).length;const exercises=[...new Set(training.map(x=>x.exercise))].sort(),options=exercises.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');return '<section><h2>Dashboard de evolução</h2><p class="muted">Indicadores calculados somente com seus registros salvos neste aparelho.</p><div class="metrics">'+metric('Peso atual',last?fmt(num(last.weight))+' kg':'—',last?last.date:'Sem registros')+metric('Variação do peso',delta===null?'—':(delta>0?'+':'')+fmt(delta)+' kg','Desde o primeiro registro')+metric('Cintura atual',lastWaist?fmt(num(lastWaist.waist))+' cm':'—',lastWaist?lastWaist.date:'Sem registros')+metric('Variação da cintura',wd===null?'—':(wd>0?'+':'')+fmt(wd)+' cm','Desde o primeiro registro')+metric('Dias de treino no mês',String(days),'Exercícios registrados: '+thisMonth.length)+metric('Alimentos registrados',String(monthFoods),'No mês atual')+'</div></section><section><h2>Gráfico de peso</h2>'+graph(weights.map(x=>({date:x.date,v:x.weight})),'Evolução do peso','kg')+'</section><section><h2>Gráfico de cintura</h2>'+graph(waists.map(x=>({date:x.date,v:x.waist})),'Evolução da cintura','cm')+'</section><section><h2>Evolução das cargas</h2>'+(exercises.length?'<label for="chartExercise">Exercício</label><select id="chartExercise" onchange="updateLoadChart()">'+options+'</select><div id="loadChart"></div>':'<p class="muted">Registre treinos para acompanhar suas cargas por exercício.</p>')+'</section><section><h2>Comparativo mensal de treinos</h2>'+[0,1,2].map(offset=>{let d=new Date(now.getFullYear(),now.getMonth()-offset,1),m=d.toLocaleDateString('en-CA').slice(0,7),t=training.filter(x=>x.date.startsWith(m));return '<div class="item"><b>'+esc(d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))+'</b><p>'+new Set(t.map(x=>x.date)).size+' dias · '+t.length+' exercícios registrados</p></div>'}).join('')+'</section>'}window.updateLoadChart=()=>{let el=document.getElementById('loadChart'),name=val('chartExercise');if(el)el.innerHTML=graph(chronological('treino').filter(x=>x.exercise===name).map(x=>({date:x.date,v:x.weight})),'Evolução de carga em '+name,'kg')};function render(){document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="${tab===t?'primary':''}" onclick="setTab('${t}')">${t}</button>`).join('');let h='';if(tab==='Dashboard'){h=dashboard()}if(tab==='Treino'){let day=new Date().getDay(),idx=day===0?0:day-1;h=`<section><h2>Registrar treino</h2>${input('date','Data','date',today())}<label>Dia</label><select id="day" onchange="updateExercises()">${DAYS.map((d,i)=>`<option value="${i}" ${i===idx?'selected':''}>${d} — ${TITLES[i]}</option>`).join('')}</select><label>Exercício</label><select id="exercise"></select><div class="grid">${input('weight','Carga (kg)','number')}${input('reps','Repetições','number')}</div>${input('sets','Séries realizadas','number',3)}<p><button class="primary" onclick="addWorkout()">Salvar exercício</button></p></section><section><h2>Últimos treinos</h2>${list('treino',x=>`<b>${esc(x.date)} · ${esc(x.exercise)}</b><p>${esc(x.sets)} séries · ${esc(x.reps)} reps · ${esc(x.weight)} kg</p>`)}</section>`}if(tab==='Evolução'){h=`<section><h2>Peso e medidas</h2>${input('date','Data','date',today())}<div class="grid">${input('bodyweight','Peso (kg)','number')}${input('waist','Cintura (cm)','number')}</div><p><button class="primary" onclick="add('corpo',{weight:val('bodyweight'),waist:val('waist')})">Salvar medidas</button></p></section><section><h2>Histórico</h2>${list('corpo',x=>`<b>${esc(x.date)}</b><p>${esc(x.weight)} kg · Cintura ${esc(x.waist)} cm</p>`)}</section>`}if(tab==='Alimentação'){h=`<section><h2>Refeições</h2>${input('date','Data','date',today())}<label>Alimento</label><select id="food"><option>Arroz cozido</option><option>Patinho cozido</option><option>Feijão cozido</option><option>Legumes</option><option>Fruta</option><option>Outro</option></select>${input('grams','Quantidade (g)','number')}<p><button class="primary" onclick="add('alimento',{food:val('food'),grams:val('grams')})">Salvar refeição</button></p></section><section><h2>Histórico</h2>${list('alimento',x=>`<b>${esc(x.date)}</b><p>${esc(x.food)} · ${esc(x.grams)} g</p>`)}</section>`}if(tab==='Aplicações'){h=`<section><h2>Diário de aplicações</h2><p class="muted">Registro descritivo, sem cálculo ou recomendação de doses.</p>${input('date','Data','date',today())}${input('drug','Medicamento / produto')}${input('amount','Quantidade informada','text')}${input('unit','Unidade (mg, mL, unidades da seringa...)')}<label>Observações / sintomas</label><textarea id="notes"></textarea><p><button class="primary" onclick="add('aplicacao',{drug:val('drug'),amount:val('amount'),unit:val('unit'),notes:val('notes')})">Salvar registro</button></p></section><section><h2>Histórico</h2>${list('aplicacao',x=>`<b>${esc(x.date)} · ${esc(x.drug)}</b><p>${esc(x.amount)} ${esc(x.unit)} · ${esc(x.notes)}</p>`)}</section>`}if(tab==='Exames'){h=`<section><h2>Registrar exame</h2>${input('date','Data da coleta','date',today())}${input('test','Exame (ex.: hematócrito)')}${input('result','Resultado')}${input('unit','Unidade')}<p><button class="primary" onclick="add('exame',{test:val('test'),result:val('result'),unit:val('unit')})">Salvar exame</button></p></section><section><h2>Histórico</h2>${list('exame',x=>`<b>${esc(x.date)} · ${esc(x.test)}</b><p>${esc(x.result)} ${esc(x.unit)}</p>`)}</section>`}if(tab==='Backup'){h=`<section><h2>Backup local</h2><p>Exporte seus dados para um arquivo JSON e guarde uma cópia em lugar seguro. Não existe sincronização na nuvem.</p><div class="actions"><button class="primary" onclick="exportData()">Exportar backup</button><label>Restaurar backup <input type="file" accept="application/json,.json" onchange="importData(event)"></label></div><p class="danger">Apagar dados do navegador ou desinstalar o app pode excluir seu histórico. O arquivo de backup contém informações pessoais de saúde: proteja-o.</p></section>`}document.getElementById('main').innerHTML=h;if(tab==='Treino')updateExercises();if(tab==='Dashboard')updateLoadChart()};window.setTab=t=>{tab=t;render()};window.updateExercises=()=>{let s=document.getElementById('exercise');if(s)s.innerHTML=WORK[Number(val('day'))].map(e=>`<option>${esc(e)}</option>`).join('')};window.addWorkout=()=>{if(!val('weight')||!val('reps'))return alert('Informe carga e repetições');add('treino',{day:val('day'),exercise:val('exercise'),weight:val('weight'),reps:val('reps'),sets:val('sets')})};window.exportData=()=>{const blob=new Blob([JSON.stringify({version:1,...db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meu-shape-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};window.importData=async ev=>{try{let data=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(data.records)||!confirm('Substituir todos os registros atuais pelo backup?'))return;db={records:data.records,diet:Array.isArray(data.diet)?data.diet:[]};save();render();alert('Backup restaurado')}catch{alert('Arquivo de backup inválido')}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
